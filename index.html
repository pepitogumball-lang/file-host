<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ninja File Host 📦</title>
    <style>
        body { font-family: -apple-system, sans-serif; background: #0d1117; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; overflow: hidden; }
        .box { text-align: center; padding: 2rem; border: 1px solid #30363d; border-radius: 12px; background: #161b22; max-width: 400px; }
        h1 { color: #58a6ff; }
        a { color: #58a6ff; text-decoration: none; font-weight: bold; }
        
        /* Modal Secreto */
        #secret-login { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 1000; justify-content: center; align-items: center; }
        .modal { background: #161b22; padding: 2rem; border: 1px solid #30363d; border-radius: 12px; text-align: center; }
        input { background: #0d1117; border: 1px solid #30363d; color: white; padding: 12px; border-radius: 6px; width: 250px; margin: 10px 0; display: block; }
        button { background: #238636; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; width: 100%; }
    </style>
</head>
<body>

<div class="box">
    <h1>Ninja File Host 📦</h1>
    <p>Depósito de archivos seguro y privado.</p>
    <a href="hub.html">Ver Archivos Públicos ➔</a>
</div>

<!-- Solo se activa con el Hash Secreto -->
<div id="secret-login">
    <div class="modal">
        <h2 style="color: #58a6ff;">Panel de Sombra 🔐</h2>
        <input type="password" id="admin-pass" placeholder="Password Maestro">
        <input type="text" id="api-url" placeholder="URL de la API (Vercel)">
        <button onclick="login()">Desbloquear Hub</button>
        <p style="font-size: 0.7rem; color: #8b949e; margin-top: 15px; cursor: pointer;" onclick="closeModal()">Cancelar</p>
    </div>
</div>

<script>
    const SECRET_HASH = "#Holaquetalsoypepi5#";
    
    function checkHash() {
        if (window.location.hash === SECRET_HASH) {
            document.getElementById('secret-login').style.display = 'flex';
        }
    }

    function closeModal() {
        document.getElementById('secret-login').style.display = 'none';
        window.location.hash = "";
    }

    function login() {
        const pass = document.getElementById('admin-pass').value;
        const url = document.getElementById('api-url').value;

        if (pass === "Holaquetalsoypepi5#") {
            localStorage.setItem("ninja_api_url", url);
            localStorage.setItem("ninja_admin_pass", pass);
            window.location.href = "hub.html";
        } else {
            alert("Acceso Denegado.");
        }
    }

    window.addEventListener('hashchange', checkHash);
    window.onload = checkHash;
</script>

</body>
</html>
