<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ninja Hub 🥷</title>
    <style>
        :root { --primary: #58a6ff; --bg: #0d1117; --card: #161b22; --border: #30363d; --text: #c9d1d9; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 800px; }
        h1 { color: var(--primary); font-size: 1.5rem; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; margin-top: 20px; }
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 15px; transition: 0.2s; }
        .card h3 { margin: 0 0 10px 0; font-size: 1rem; color: var(--primary); }
        .card p { margin: 5px 0; font-size: 0.85rem; color: #8b949e; }
        .actions { margin-top: 15px; display: flex; gap: 10px; }
        button { background: #21262d; border: 1px solid var(--border); color: var(--primary); padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; }
        
        /* Panel de Admin Oculto por defecto */
        #admin-panel { display: none; margin-top: 30px; padding: 20px; border-top: 1px dashed var(--border); width: 100%; }
        .upload-area { border: 2px dashed var(--border); padding: 30px; text-align: center; border-radius: 12px; cursor: pointer; margin-bottom: 20px; }
        .upload-area:hover { border-color: var(--primary); }
        input[type="file"] { display: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>Archivos 📦</h1>
    <p id="status-text" style="color: #8b949e; font-size: 0.9rem;">Cargando lista...</p>
    <div id="file-grid" class="grid"></div>
</div>

<div id="admin-panel" class="container">
    <h2 style="color: #3fb950;">Panel de Control 🛠️</h2>
    <div class="upload-area" onclick="document.getElementById('file-input').click()">
        <span>Click para subir archivo</span>
        <input type="file" id="file-input" onchange="handleUpload(this.files[0])">
    </div>
    <button onclick="logout()" style="color: #f85149; border-color: #f8514922;">Cerrar Sesión</button>
</div>

<script>
    const STORAGE_KEY = "ninja_api_url";
    const PASS_KEY = "ninja_admin_pass";
    let apiUrl = localStorage.getItem(STORAGE_KEY);
    let pass = localStorage.getItem(PASS_KEY);

    async function loadFiles() {
        const grid = document.getElementById('file-grid');
        const status = document.getElementById('status-text');
        
        try {
            let response = await fetch('files.json').catch(() => null);
            let files = [];
            
            if (response && response.ok) {
                files = await response.json();
                status.innerText = "Lista pública actualizada.";
            }

            if (files.length === 0) {
                status.innerText = "No hay archivos disponibles.";
                return;
            }

            grid.innerHTML = '';
            files.forEach(file => {
                const url = file.permanent_url || `${window.location.origin}/files/${file.name}`;
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <h3>${file.name}</h3>
                    <div class="actions">
                        <button onclick="window.open('${url}')">Ver</button>
                        ${pass ? `<button style="color:#f85149" onclick="deleteFile('${file.name}', '${file.sha}')">Borrar</button>` : ''}
                    </div>
                `;
                grid.appendChild(card);
            });

            // Mostrar panel solo si hay sesión activa
            if (pass && apiUrl) {
                document.getElementById('admin-panel').style.display = 'block';
            }

        } catch (e) {
            status.innerText = "Error de conexión.";
        }
    }

    async function handleUpload(file) {
        if (!file || !apiUrl || !pass) return;
        const reader = new FileReader();
        reader.onload = async (e) => {
            const content = e.target.result.split(',')[1];
            const res = await fetch(apiUrl.replace(/\/$/, '') + '/api/manage', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'x-admin-password': pass },
                body: JSON.stringify({ name: file.name, content })
            });
            if (res.ok) { alert("Subido!"); loadFiles(); }
            else alert("Error al subir.");
        };
        reader.readAsDataURL(file);
    }

    async function deleteFile(name, sha) {
        if (!confirm(`¿Borrar ${name}?`)) return;
        const res = await fetch(apiUrl.replace(/\/$/, '') + '/api/manage', {
            method: 'DELETE',
            headers: { 'Content-Type': 'application/json', 'x-admin-password': pass },
            body: JSON.stringify({ name, sha })
        });
        if (res.ok) loadFiles();
    }

    function logout() {
        localStorage.clear();
        window.location.reload();
    }

    loadFiles();
</script>

</body>
</html>
