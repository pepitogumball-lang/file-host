<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ninja File Host 🥷</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background: #0d1117; color: white; margin: 0; }
        .box { background: #161b22; padding: 2.5rem; border-radius: 12px; border: 1px solid #30363d; box-shadow: 0 4px 15px rgba(0,0,0,0.5); text-align: center; width: 100%; max-width: 400px; }
        input { display: none; }
        label { background: #238636; color: white; padding: 12px 24px; border-radius: 6px; cursor: pointer; transition: 0.2s; font-weight: bold; }
        label:hover { background: #2ea043; }
        #result { margin-top: 25px; display: none; word-break: break-all; }
        #status { margin-top: 15px; font-size: 0.9rem; color: #8b949e; }
        code { background: #0d1117; padding: 10px; border-radius: 6px; border: 1px dashed #58a6ff; display: block; margin-top: 10px; color: #58a6ff; font-size: 0.85rem; }
        h2 { color: #58a6ff; margin-bottom: 0.5rem; }
        .admin-link { margin-top: 20px; font-size: 0.7rem; color: #30363d; text-decoration: none; }
        .admin-link:hover { color: #58a6ff; }
    </style>
</head>
<body>
<div class="box">
    <h2>Ninja Host 🥷</h2>
    <p style="color: #8b949e; margin-bottom: 1.5rem;">Sube archivos temporales (Ninja Mode)</p>
    <label for="fileInput">Subida Ninja</label>
    <input type="file" id="fileInput">
    <div id="status"></div>
    <div id="result">
        <p style="font-size: 0.9rem;">Tu link ninja:</p>
        <code id="final-url"></code>
    </div>
    <a href="admin.html" class="admin-link">Manage Hub</a>
</div>
<script>
    const input = document.getElementById('fileInput');
    const status = document.getElementById('status');
    const result = document.getElementById('result');
    const finalUrl = document.getElementById('final-url');
    input.onchange = async () => {
        if (!input.files[0]) return;
        status.innerText = "Subiendo archivo ninja... 🚀";
        const fd = new FormData();
        fd.append('file', input.files[0]);
        try {
            const res = await fetch('https://tmpfiles.org/api/v1/upload', { method: 'POST', body: fd });
            const json = await res.json();
            if (json.status === 'success') {
                const directUrl = json.data.url.replace('tmpfiles.org/', 'tmpfiles.org/dl/');
                const ninjaLink = `${window.location.origin}${window.location.pathname}?n=${directUrl}`;
                finalUrl.innerText = ninjaLink;
                result.style.display = 'block';
                status.innerText = "¡Subida ninja lista! 🥷";
            } else {
                status.innerText = "Error en las sombras... (；д；)";
            }
        } catch (e) { status.innerText = "Error de conexión... ///"; }
    };
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('n')) {
        window.location.href = urlParams.get('n');
        setTimeout(() => { window.location.href = "about:blank"; }, 800);
    }
</script>
<div style="margin-top:20px; display:flex; gap:10px; justify-content:center;"><a href="hub.html" style="color:#8b949e; text-decoration:none; font-size:0.8rem; border:1px solid #30363d; padding:5px 10px; border-radius:5px;">Public Hub 🥷</a><a href="admin.html" style="color:#8b949e; text-decoration:none; font-size:0.8rem; border:1px solid #30363d; padding:5px 10px; border-radius:5px;">Admin 🎛️</a></div></body>
</html>
