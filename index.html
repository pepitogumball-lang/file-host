<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienvenido Ninja 🥷</title>
    <style>
        body { font-family: sans-serif; background: #0d1117; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { text-align: center; padding: 2rem; border: 1px solid #30363d; border-radius: 12px; background: #161b22; }
        h1 { color: #58a6ff; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="box">
    <h1>Ninja File Host 📦</h1>
    <p>Solo para sombras autorizadas.</p>
    <a href="hub.html" style="color: #58a6ff; text-decoration: none;">Ir al Hub Público ➔</a>
</div>

<script>
    let sequence = "";
    const SECRET = "Holaquetalsoypepi5#";
    const STORAGE_KEY = "ninja_api_url";
    const PASS_KEY = "ninja_admin_pass";

    document.addEventListener('keydown', (e) => {
        sequence += e.key;
        if (sequence.length > 50) sequence = sequence.substring(1);
        
        if (sequence.endsWith(SECRET)) {
            sequence = "";
            let apiUrl = localStorage.getItem(STORAGE_KEY);
            let pass = localStorage.getItem(PASS_KEY);

            if (!apiUrl) {
                apiUrl = prompt("🔓 Acceso de Desarrollador Detectado.\nIntroduce la URL de tu API de Vercel:");
                if (apiUrl) localStorage.setItem(STORAGE_KEY, apiUrl);
            }

            if (!pass) {
                pass = prompt("Introduce tu Password de Admin:");
                if (pass) localStorage.setItem(PASS_KEY, pass);
            }

            if (apiUrl && pass) {
                alert("✨ Identidad verificada. Entrando al Hub modo Admin...");
                window.location.href = "hub.html";
            }
        }
    });
</script>

</body>
</html>
