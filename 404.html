<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Ninja Redirect 🥷</title>
    <script type="text/javascript">
        // Si el usuario intentó entrar a /file-host/Holaquetalsoypepi5#
        // lo redirigimos a index.html conservando el secreto en el hash
        var path = window.location.pathname;
        if (path.includes("Holaquetalsoypepi5")) {
            window.location.href = window.location.origin + path.split("file-host")[0] + "file-host/#Holaquetalsoypepi5#";
        } else {
            // 404 normal
            document.write("<h1>404: Not Found</h1>");
        }
    </script>
</head>
<body>
</body>
</html>
