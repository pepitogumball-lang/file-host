<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ninja Hub 🥷</title>
    <style>
        :root { --primary: #58a6ff; --bg: #0d1117; --card: #161b22; --border: #30363d; --text: #c9d1d9; --success: #3fb950; --danger: #f85149; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .container { width: 100%; max-width: 850px; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 10px; margin-bottom: 20px; }
        h1 { color: var(--primary); margin: 0; font-size: 1.5rem; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 15px; }
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 15px; display: flex; flex-direction: column; }
        .card h3 { margin: 0 0 10px 0; font-size: 1rem; color: var(--primary); word-break: break-all; }
        .actions { margin-top: auto; display: flex; flex-wrap: wrap; gap: 8px; padding-top: 15px; }
        button { background: #21262d; border: 1px solid var(--border); color: var(--text); padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; flex-grow: 1; }
        button:hover { background: #30363d; }
        .btn-link { color: var(--primary); }
        .btn-del { color: var(--danger); border-color: #f8514933; }
        
        #admin-panel { display: none; margin-top: 40px; padding: 20px; background: #161b22; border: 1px solid var(--border); border-radius: 12px; width: 100%; box-sizing: border-box; }
        .upload-area { border: 2px dashed var(--border); padding: 40px; text-align: center; border-radius: 10px; cursor: pointer; margin-bottom: 20px; transition: 0.3s; }
        .upload-area:hover { border-color: var(--success); background: #1f242b; }
        input[type="file"] { display: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Ninja Hub 📦</h1>
        <a href="index.html" style="color: #8b949e; text-decoration: none; font-size: 0.9rem;">Volver ➔</a>
    </div>
    <p id="status" style="color: #8b949e; margin-bottom: 20px;">Cargando archivos...</p>
    <div id="file-grid" class="grid"></div>
</div>

<div id="admin-panel" class="container">
    <h2 style="color: var(--success); margin-top: 0;">Panel de Administración 🛠️</h2>
    <div class="upload-area" onclick="document.getElementById('file-input').click()">
        <span id="upload-label">Click para subir un nuevo archivo</span>
        <input type="file" id="file-input" onchange="uploadFile(this.files[0])">
    </div>
    <div style="display: flex; justify-content: space-between; align-items: center;">
        <small style="color: #8b949e;">Sesión activa: Sombras Autorizadas</small>
        <button onclick="logout()" style="max-width: 150px; border-color: var(--danger); color: var(--danger);">Cerrar Sesión</button>
    </div>
</div>

<script>
    const API_URL = localStorage.getItem("ninja_api_url");
    const PASS = localStorage.getItem("ninja_admin_pass");

    async function load() {
        const grid = document.getElementById('file-grid');
        const status = document.getElementById('status');
        
        // MOSTRAR PANEL DE ADMIN DE INMEDIATO SI EXISTE SESIÓN
        if (PASS && API_URL) {
            document.getElementById('admin-panel').style.display = 'block';
        }

        try {
            const res = await fetch('files.json?' + Date.now());
            const files = res.ok ? await res.json() : [];

            if (files.length === 0) {
                status.innerText = "No hay archivos públicos todavía.";
                grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #8b949e; padding: 40px;">El depósito está vacío.</p>';
            } else {
                status.innerText = `${files.length} archivos en el depósito.`;
                grid.innerHTML = '';
                files.forEach(f => {
                    const permLink = `${window.location.origin}${window.location.pathname.replace('hub.html', '')}files/${f.name}`;
                    const tempLink = API_URL ? `${API_URL}/api/raw?name=${f.name}` : '#';
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <h3>${f.name}</h3>
                        <div class="actions">
                            <button class="btn-link" onclick="copy('${permLink}')">Link Perm.</button>
                            <button class="btn-link" onclick="copy('${tempLink}')">Link Temp.</button>
                            ${PASS ? `<button class="btn-del" onclick="del('${f.name}', '${f.sha}')">Borrar</button>` : ''}
                        </div>
                    `;
                    grid.appendChild(card);
                });
            }
        } catch (e) {
            status.innerText = "Error al conectar con la base de datos.";
        }
    }

    function copy(text) {
        navigator.clipboard.writeText(text);
        alert("¡Link copiado!");
    }

    async function uploadFile(file) {
        if (!file || !API_URL) return;
        const label = document.getElementById('upload-label');
        label.innerText = `Subiendo: ${file.name}...`;

        const reader = new FileReader();
        reader.onload = async (e) => {
            const content = e.target.result.split(',')[1];
            try {
                const res = await fetch(`${API_URL}/api/manage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'x-admin-password': PASS },
                    body: JSON.stringify({ name: file.name, content })
                });
                if (res.ok) {
                    alert("¡Archivo subido!");
                    location.reload();
                } else {
                    alert("Error en la subida. Verifica tu configuración.");
                }
            } catch (err) {
                alert("Error de conexión con Vercel.");
            }
            label.innerText = "Click para subir otro archivo";
        };
        reader.readAsDataURL(file);
    }

    async function del(name, sha) {
        if (!confirm(`¿Eliminar ${name} permanentemente?`)) return;
        try {
            const res = await fetch(`${API_URL}/api/manage`, {
                method: 'DELETE',
                headers: { 'Content-Type': 'application/json', 'x-admin-password': PASS },
                body: JSON.stringify({ name, sha })
            });
            if (res.ok) location.reload();
            else alert("No se pudo borrar.");
        } catch (e) { alert("Error de conexión."); }
    }

    function logout() {
        localStorage.clear();
        location.reload();
    }

    load();
</script>

</body>
</html>
