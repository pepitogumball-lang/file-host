name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Generate File List
        run: |
          cat << 'HTML' > index.html
          <!DOCTYPE html>
          <html lang="es">
          <head>
              <meta charset="UTF-8">
              <title>Zapia File Host</title>
              <style>
                  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; line-height: 1.6; color: #24292e; max-width: 800px; margin: 0 auto; padding: 40px 20px; background-color: #f6f8fa; }
                  .container { background: #fff; border: 1px solid #e1e4e8; border-radius: 6px; padding: 32px; box-shadow: 0 1px 3px rgba(27,31,35,0.12); }
                  h1 { border-bottom: 1px Kolid #eaecef; padding-bottom: 10px; margin-top: 0; }
                  ul { list-style: none; padding: 0; }
                  li { margin-bottom: 16px; padding: 16px; background: #fff; border: 1px solid #d1d5da; border-radius: 6px; }
                  .file-name { font-weight: 600; font-size: 18px; color: #0366d6; text-decoration: none; display: block; margin-bottom: 8px; }
                  .file-name:hover { text-decoration: underline; }
                  .direct-link { background: #f1f8ff; padding: 8px; border-radius: 4px; font-family: ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace; font-size: 12px; color: #0366d6; border: 1px solid #c8e1ff; word-break: break-all; display: block; }
                  .info { font-size: 14px; color: #586069; margin-bottom: 20px; }
              </style>
          </head>
          <body>
              <div class="container">
                  <h1>Direct Download Host</h1>
                  <p class="info">Sube cualquier archivo al repositorio y aparecerá aquí con un link de descarga directa.</p>
                  <ul id="file-list">
          HTML
          
          for f in *; do
            # Ignorar archivos ocultos, el workflow, el index y el README
            if [ -f "$f" ] && [[ "$f" != "index.html" ]] && [[ "$f" != "README.md" ]] && [[ "$f" != "."* ]]; then
              echo "<li><a href='$f' download class='file-name'>$f</a><code class='direct-link' id='link-$f'></code></li>" >> index.html
            fi
          done
          
          cat << 'HTML' >> index.html
                  </ul>
              </div>
              <script>
                document.querySelectorAll('.direct-link').forEach(box => {
                    const filename = box.id.replace('link-', '');
                    // Construir link absoluto
                    const url = window.location.origin + window.location.pathname.replace('index.html', '') + filename;
                    box.textContent = url;
                });
              </script>
          </body>
          </html>
          HTML
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
