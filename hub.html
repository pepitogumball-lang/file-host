<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ninja Hub 🥷</title>
    <style>
        :root { --primary: #58a6ff; --bg: #0d1117; --card: #161b22; --border: #30363d; --text: #c9d1d9; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 800px; }
        h1 { color: var(--primary); display: flex; align-items: center; gap: 10px; font-size: 1.5rem; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; margin-top: 20px; }
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 15px; transition: transform 0.2s, border-color 0.2s; position: relative; overflow: hidden; }
        .card:hover { transform: translateY(-3px); border-color: var(--primary); }
        .card h3 { margin: 0 0 10px 0; font-size: 1rem; word-break: break-all; color: var(--primary); }
        .card p { margin: 5px 0; font-size: 0.85rem; color: #8b949e; }
        .actions { margin-top: 15px; display: flex; gap: 10px; }
        button { background: #21262d; border: 1px solid var(--border); color: var(--primary); padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; transition: 0.2s; }
        button:hover { background: #30363d; border-color: #8b949e; }
        .copy-btn { color: #3fb950; border-color: #23863622; }
        .status { margin-top: 20px; font-size: 0.9rem; color: #8b949e; }
        .loader { border: 3px solid #30363d; border-top: 3px solid var(--primary); border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; display: inline-block; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #admin-panel { display: none; margin-top: 30px; padding: 20px; border-top: 1px dashed var(--border); width: 100%; }
        .upload-area { border: 2px dashed var(--border); padding: 30px; text-align: center; border-radius: 12px; cursor: pointer; margin-bottom: 20px; }
        .upload-area:hover { border-color: var(--primary); background: #1c2128; }
        input[type="file"] { display: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>Ninja Hub 🥷 <span id="loading" class="loader" style="display: none;"></span></h1>
    <p id="status-text" class="status">Cargando archivos de las sombras...</p>
    
    <div id="file-grid" class="grid"></div>
</div>

<div id="admin-panel" class="container">
    <h2>Panel de Control ⚙️</h2>
    <div class="upload-area" onclick="document.getElementById('file-input').click()">
        <span>Click o arrastra para subir un nuevo archivo ninja</span>
        <input type="file" id="file-input" onchange="handleUpload(this.files[0])">
    </div>
</div>

<script>
    const STORAGE_KEY = "ninja_api_url";
    const PASS_KEY = "ninja_admin_pass";
    let apiUrl = localStorage.getItem(STORAGE_KEY);
    let pass = localStorage.getItem(PASS_KEY);

    async function loadFiles() {
        const grid = document.getElementById('file-grid');
        const status = document.getElementById('status-text');
        const loader = document.getElementById('loading');
        
        loader.style.display = 'inline-block';
        grid.innerHTML = '';

        try {
            // Intentar cargar desde files.json primero (público)
            let response = await fetch('files.json').catch(() => null);
            let files = [];
            
            if (response && response.ok) {
                files = await response.json();
                status.innerText = "Mostrando archivos públicos.";
            } else if (apiUrl) {
                // Si no hay json, intentar vía API si tenemos el URL
                status.innerText = "Consultando API directa...";
                const apiRes = await fetch(apiUrl.replace(/\/$/, '') + '/api/manage', {
                    headers: { 'x-admin-password': pass }
                });
                if (apiRes.ok) {
                    files = await apiRes.json();
                    status.innerText = "Conectado a la API Ninja.";
                    document.getElementById('admin-panel').style.display = 'block';
                }
            }

            if (files.length === 0) {
                status.innerText = "No hay archivos visibles todavía.";
                return;
            }

            files.forEach(file => {
                const url = file.permanent_url || `${window.location.origin}/files/${file.name}`;
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <h3>${file.name}</h3>
                    <p>Tamaño: ${(file.size / 1024).toFixed(1)} KB</p>
                    <div class="actions">
                        <button onclick="window.open('${url}')">Ver</button>
                        <button class="copy-btn" onclick="copyLink('${url}')">Link</button>
                        ${pass ? `<button style="color:#f85149" onclick="deleteFile('${file.name}', '${file.sha}')">Borrar</button>` : ''}
                    </div>
                `;
                grid.appendChild(card);
            });

        } catch (e) {
            status.innerText = "Error al conectar con las sombras. Revisa la consola.";
            console.error(e);
        } finally {
            loader.style.display = 'none';
        }
    }

    async function handleUpload(file) {
        if (!file || !apiUrl || !pass) return;
        
        const status = document.getElementById('status-text');
        status.innerText = `Subiendo ${file.name}... ⏳`;
        
        const reader = new FileReader();
        reader.onload = async (e) => {
            const content = e.target.result.split(',')[1];
            try {
                const res = await fetch(apiUrl.replace(/\/$/, '') + '/api/manage', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'x-admin-password': pass },
                    body: JSON.stringify({ name: file.name, content })
                });
                if (res.ok) {
                    status.innerText = "¡Subida exitosa! Espera un momento...";
                    setTimeout(loadFiles, 2000);
                } else {
                    const err = await res.json();
                    alert("Error: " + err.error);
                }
            } catch (e) { alert("Error de conexión"); }
        };
        reader.readAsDataURL(file);
    }

    async function deleteFile(name, sha) {
        if (!confirm(`¿Borrar ${name}?`)) return;
        const res = await fetch(apiUrl.replace(/\/$/, '') + '/api/manage', {
            method: 'DELETE',
            headers: { 'Content-Type': 'application/json', 'x-admin-password': pass },
            body: JSON.stringify({ name, sha })
        });
        if (res.ok) loadFiles();
        else alert("No se pudo borrar.");
    }

    function copyLink(url) {
        navigator.clipboard.writeText(url);
        alert("Link copiado! 📋");
    }

    // El "Secret Access" se hereda de index.html si el usuario entra por ahí.
    // Pero si ya tiene los datos en localStorage, cargamos todo.
    loadFiles();
</script>

</body>
</html>
