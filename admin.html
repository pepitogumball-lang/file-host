<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ninja Hub Admin 🎛️</title>
    <style>
        body { font-family: sans-serif; background: #0d1117; color: white; display: flex; flex-direction: column; align-items: center; padding: 2rem; }
        .container { width: 100%; max-width: 800px; background: #161b22; padding: 2rem; border-radius: 12px; border: 1px solid #30363d; }
        h1 { color: #58a6ff; margin-bottom: 1.5rem; display: flex; align-items: center; gap: 10px; }
        .config-section { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 2rem; padding: 1rem; background: #0d1117; border-radius: 8px; border: 1px solid #30363d; }
        .input-group { display: flex; flex-direction: column; gap: 5px; }
        label { font-size: 0.8rem; color: #8b949e; }
        input { background: #0d1117; border: 1px solid #30363d; color: white; padding: 8px; border-radius: 4px; }
        .upload-zone { border: 2px dashed #30363d; padding: 2rem; text-align: center; border-radius: 8px; margin-bottom: 2rem; cursor: pointer; transition: 0.2s; }
        .upload-zone:hover { border-color: #58a6ff; background: #1f242c; }
        .file-list { display: flex; flex-direction: column; gap: 10px; }
        .file-item { background: #0d1117; padding: 10px 15px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #30363d; }
        .file-info { display: flex; flex-direction: column; }
        .file-name { font-weight: bold; color: #c9d1d9; }
        .file-meta { font-size: 0.75rem; color: #8b949e; }
        .actions { display: flex; gap: 10px; }
        button { padding: 6px 12px; border-radius: 4px; border: none; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .btn-copy { background: #238636; color: white; }
        .btn-copy:hover { background: #2ea043; }
        .btn-del { background: #da3633; color: white; }
        .btn-del:hover { background: #f85149; }
        .btn-refresh { background: #21262d; color: #c9d1d9; border: 1px solid #30363d; margin-bottom: 1rem; }
        #status { position: fixed; bottom: 20px; right: 20px; padding: 10px 20px; border-radius: 6px; display: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>Ninja Hub Admin 🎛️</h1>

    <div class="config-section">
        <div class="input-group">
            <label>Vercel API URL</label>
            <input type="text" id="apiUrl" placeholder="https://tu-api.vercel.app" onchange="saveConfig()">
        </div>
        <div class="input-group">
            <label>Admin Password</label>
            <input type="password" id="adminPass" placeholder="Tu contraseña" onchange="saveConfig()">
        </div>
    </div>

    <div class="upload-zone" onclick="document.getElementById('fileInput').click()">
        <p>Click para subir archivo permanente al repo 🚀</p>
        <input type="file" id="fileInput" style="display: none" onchange="handleUpload(this)">
    </div>

    <div style="display: flex; justify-content: space-between; align-items: center;">
        <h2>Archivos Permanentes (/files)</h2>
        <button class="btn-refresh" onclick="loadFiles()">Actualizar Lista 🔄</button>
    </div>
    
    <div class="file-list" id="fileList">
        <p style="color: #8b949e">Cargando archivos...</p>
    </div>
</div>

<div id="status"></div>

<script>
    const apiUrlInput = document.getElementById('apiUrl');
    const adminPassInput = document.getElementById('adminPass');
    const fileList = document.getElementById('fileList');
    const statusDiv = document.getElementById('status');

    // Load config from localStorage
    apiUrlInput.value = localStorage.getItem('ninja_api_url') || '';
    adminPassInput.value = localStorage.getItem('ninja_admin_pass') || '';

    function saveConfig() {
        localStorage.setItem('ninja_api_url', apiUrlInput.value);
        localStorage.setItem('ninja_admin_pass', adminPassInput.value);
    }

    function showStatus(msg, isError = false) {
        statusDiv.innerText = msg;
        statusDiv.style.display = 'block';
        statusDiv.style.background = isError ? '#da3633' : '#238636';
        setTimeout(() => statusDiv.style.display = 'none', 3000);
    }

    async function loadFiles() {
        try {
            const res = await fetch('files.json?t=' + Date.now());
            if (!res.ok) throw new Error();
            const files = await res.json();
            renderFiles(files);
        } catch (e) {
            fileList.innerHTML = '<p style="color: #da3633">No se pudo cargar files.json. Asegúrate de que el workflow haya corrido.</p>';
        }
    }

    function renderFiles(files) {
        if (files.length === 0) {
            fileList.innerHTML = '<p style="color: #8b949e">No hay archivos aún.</p>';
            return;
        }
        fileList.innerHTML = files.map(f => `
            <div class="file-item">
                <div class="file-info">
                    <span class="file-name">${f.name}</span>
                    <span class="file-meta">${(f.size / 1024).toFixed(1)} KB</span>
                </div>
                <div class="actions">
                    <button class="btn-copy" onclick="copyLink('${f.name}')">Link</button>
                    <button class="btn-del" onclick="deleteFile('${f.name}')">Borrar</button>
                </div>
            </div>
        `).join('');
    }

    function copyLink(name) {
        const url = `${window.location.origin}${window.location.pathname.replace('admin.html', '')}files/${name}`;
        navigator.clipboard.writeText(url);
        showStatus('Link copiado! 📋');
    }

    async function handleUpload(input) {
        if (!input.files[0]) return;
        const file = input.files[0];
        const reader = new FileReader();
        reader.onload = async () => {
            const content = reader.result.split(',')[1];
            await callApi('POST', { name: file.name, content });
        };
        reader.readAsDataURL(file);
    }

    async function deleteFile(name) {
        if (!confirm(`¿Borrar ${name} permanentemente?`)) return;
        await callApi('DELETE', { name });
    }

    async function callApi(method, data) {
        const url = apiUrlInput.value.replace(/\/$/, '') + '/api/manage';
        const password = adminPassInput.value;
        if (!url || !password) {
            alert('Configura la URL de la API y el Password primero.');
            return;
        }

        showStatus('Procesando... ⏳');
        try {
            const res = await fetch(url, {
                method,
                headers: { 'Content-Type': 'application/json', 'x-admin-password': password },
                body: JSON.stringify(data)
            });
            const resData = await res.json();
            if (res.ok) {
                showStatus('Éxito! 🎉 El repo se está actualizando.');
                setTimeout(loadFiles, 2000);
            } else {
                showStatus('Error: ' + (resData.error || 'Fallo desconocido'), true);
            }
        } catch (e) {
            showStatus('Error de conexión a la API ❌', true);
        }
    }

    loadFiles();
</script>
</body>
</html>
