<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ninja File Host 🥷</title>

    <style>
        body {
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: #0d1117;
            color: white;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .box {
            background: #161b22;
            padding: 2.5rem;
            border-radius: 12px;
            border: 1px solid #30363d;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            text-align: center;
            width: 100%;
            max-width: 420px;
        }

        input {
            display: none;
        }

        label {
            background: #238636;
            color: white;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
            font-weight: bold;
            display: inline-block;
        }

        label:hover {
            background: #2ea043;
        }

        #result {
            margin-top: 25px;
            display: none;
            word-break: break-all;
        }

        #status {
            margin-top: 15px;
            font-size: 0.9rem;
            color: #8b949e;
        }

        code {
            background: #0d1117;
            padding: 10px;
            border-radius: 6px;
            border: 1px dashed #58a6ff;
            display: block;
            margin-top: 10px;
            color: #58a6ff;
            font-size: 0.85rem;
        }

        h2 {
            color: #58a6ff;
            margin-bottom: 0.5rem;
        }

        button {
            margin-top: 12px;
            background: #30363d;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #484f58;
        }

        .download-mode {
            text-align: center;
        }

        .download-mode a {
            color: #58a6ff;
            word-break: break-all;
        }
    </style>
</head>
<body>

<div class="box" id="mainBox">

    <h2>Ninja Host 🥷</h2>

    <p style="color: #8b949e; margin-bottom: 1.5rem;">
        Sube archivos y genera links ninja
    </p>

    <label for="fileInput">Seleccionar archivo</label>

    <input type="file" id="fileInput">

    <div id="status"></div>

    <div id="result">
        <p style="font-size: 0.9rem;">Tu link ninja:</p>

        <code id="final-url"></code>

        <button onclick="copyLink()">Copiar link</button>
    </div>

</div>

<script>
    const input = document.getElementById('fileInput');
    const status = document.getElementById('status');
    const result = document.getElementById('result');
    const finalUrl = document.getElementById('final-url');

    // =========================
    // SUBIDA
    // =========================

    input.onchange = async () => {

        if (!input.files[0]) return;

        status.innerText = "Subiendo archivo... 🚀";

        const fd = new FormData();
        fd.append('file', input.files[0]);

        try {

            const res = await fetch(
                'https://tmpfiles.org/api/v1/upload',
                {
                    method: 'POST',
                    body: fd
                }
            );

            const json = await res.json();

            if (json.status === 'success') {

                const directUrl =
                    json.data.url.replace(
                        'tmpfiles.org/',
                        'tmpfiles.org/dl/'
                    );

                const ninjaLink =
                    `${window.location.origin}${window.location.pathname}?n=${encodeURIComponent(directUrl)}`;

                finalUrl.innerText = ninjaLink;

                result.style.display = 'block';

                status.innerText = "¡Subida lista! 🥷";

            } else {

                status.innerText =
                    "Etto... falló la subida. (；д；)";
            }

        } catch (e) {

            status.innerText =
                "Error de conexión... ///";
        }
    };

    // =========================
    // COPIAR LINK
    // =========================

    function copyLink() {

        navigator.clipboard.writeText(
            finalUrl.innerText
        );

        alert("Link copiado 🥷");
    }

    // =========================
    // MODO DESCARGA
    // =========================

    const urlParams =
        new URLSearchParams(window.location.search);

    if (urlParams.get('n')) {

        const downloadUrl =
            decodeURIComponent(urlParams.get('n'));

        document.getElementById('mainBox').innerHTML = `
            <div class="download-mode">
                <h2>Descarga Ninja 🥷</h2>

                <p>
                    Tu descarga está lista:
                </p>

                <p>
                    <a href="${downloadUrl}" target="_blank">
                        Abrir descarga
                    </a>
                </p>

                <br>

                <button onclick="window.location.href='${downloadUrl}'">
                    Descargar archivo
                </button>
            </div>
        `;
    }
</script>

</body>
</html>
